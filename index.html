<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>PMDC Motor ID - Dark Mobile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 深色模式基礎設定 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 10px; 
            background: #121212; /* 極深灰背景 */
            color: #e0e0e0; 
        }
        
        h3 { color: #ffffff; margin-bottom: 20px; }

        /* 滑桿容器調整為深灰色 */
        .slider-container { 
            margin: 15px 0; 
            background: #1e1e1e; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }

        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 8px; 
            color: #bb86fc; /* 標題使用粉紫色點綴 */
        }

        input[type="range"] { 
            width: 100%; 
            height: 30px; 
            accent-color: #bb86fc; /* 調整滑桿主色調 */
        }

        .val-disp { 
            color: #03dac6; /* 數值顯示使用亮青色 */
            float: right; 
            font-family: monospace;
            font-size: 1.1em;
        }

        /* 畫布背景 */
        canvas { 
            background: #1e1e1e; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            padding: 5px;
        }
    </style>
</head>
<body>

    <h3 style="text-align:center;">PMDC No-Load Identification</h3>
    
    <canvas id="rpmChart"></canvas>
    <canvas id="currChart"></canvas>

    <div class="slider-container">
        <label>Ke (V/rads): <span id="keVal" class="val-disp">0.05</span></label>
        <input type="range" id="ke" min="0.03" max="0.08" step="0.001" value="0.04">
    </div>

    <div class="slider-container">
        <label>V_brush (V): <span id="vbVal" class="val-disp">0.0</span></label>
        <input type="range" id="vb" min="0" max="3" step="0.1" value="0">
    </div>

    <div class="slider-container">
        <label>Friction B: <span id="bVal" class="val-disp">0.0001</span></label>
        <input type="range" id="b" min="0" max="0.0005" step="0.00001" value="0.00001">
    </div>

<script>
// --- 1. 初始化數據與真實參數 ---
const Va = Array.from({length: 20}, (_, i) => i * 1.6);
const RA = 2.5;
const KE_REAL = 0.052, VB_REAL = 1.1, B_REAL = 0.00018, TC_REAL = 0.015;

function calc(v_arr, ke, vb, b, tc) {
    return v_arr.map(v => {
        let num = v - vb - (RA * tc / ke);
        let den = ke + (RA * b / ke);
        let w = num / den > 0 ? num / den : 0;
        let ia = w > 0 ? (b * w + tc) / ke : 0;
        return { rpm: w * 60 / (2 * Math.PI), ia: ia };
    });
}

const realData = calc(Va, KE_REAL, VB_REAL, B_REAL, TC_REAL);

// Chart.js 深色模式通用配置
const darkOptions = {
    responsive: true,
    scales: {
        x: {
            grid: { color: '#333' },
            ticks: { color: '#aaa' }
        },
        y: {
            grid: { color: '#333' },
            ticks: { color: '#aaa' }
        }
    },
    plugins: {
        legend: { labels: { color: '#e0e0e0' } }
    }
};

// --- 2. Chart.js 配置 ---
const ctx1 = document.getElementById('rpmChart').getContext('2d');
const rpmChart = new Chart(ctx1, {
    type: 'line',
    data: {
        labels: Va,
        datasets: [
            { label: 'Real RPM', data: realData.map(d => d.rpm), borderColor: '#ff5252', showLine: false, pointRadius: 4 },
            { label: 'Model RPM', data: [], borderColor: '#448aff', borderWidth: 2, pointRadius: 0 }
        ]
    },
    options: { ...darkOptions, scales: { ...darkOptions.scales, y: { ...darkOptions.scales.y, min: 0, max: 2000 } } }
});

const ctx2 = document.getElementById('currChart').getContext('2d');
const currChart = new Chart(ctx2, {
    type: 'line',
    data: {
        labels: Va,
        datasets: [
            { label: 'Real Current', data: realData.map(d => d.ia), borderColor: '#ff5252', showLine: false, pointRadius: 4 },
            { label: 'Model Current', data: [], borderColor: '#69f0ae', borderWidth: 2, pointRadius: 0 }
        ]
    },
    options: darkOptions
});

// --- 3. 更新函數 ---
function update() {
    const ke = parseFloat(document.getElementById('ke').value);
    const vb = parseFloat(document.getElementById('vb').value);
    const b = parseFloat(document.getElementById('b').value);
    
    document.getElementById('keVal').innerText = ke;
    document.getElementById('vbVal').innerText = vb;
    document.getElementById('bVal').innerText = b;

    const simData = calc(Va, ke, vb, b, TC_REAL);
    
    rpmChart.data.datasets[1].data = simData.map(d => d.rpm);
    currChart.data.datasets[1].data = simData.map(d => d.ia);
    
    rpmChart.update('none');
    currChart.update('none');
}

document.querySelectorAll('input').forEach(input => input.addEventListener('input', update));
update();
</script>
</body>
</html>
